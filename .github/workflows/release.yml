name: Auto Force Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: GitHub CLI installieren
        run: |
          sudo apt update
          sudo apt install -y gh zip

      - name: Force Releases erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_version=""
          latest_number=0

          for d in */ ; do
            folder=$(basename "$d")
            VERSION=$(echo "$folder" | awk -F'_' '{print $NF}')
            VERSION="v$VERSION"

            ZIPFILE="${folder}.zip"
            echo "Hauptordner gefunden: $folder"
            echo "Force Release wird erstellt: $folder -> $VERSION"

            # ZIP erstellen
            zip -r "$ZIPFILE" "$folder"
            echo "ZIP-Datei erstellt: $ZIPFILE"

            # Release löschen, falls schon vorhanden
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "Release $VERSION existiert bereits, lösche es..."
              gh release delete "$VERSION" --yes
            fi

            # Neues Release erstellen
            gh release create "$VERSION" "$ZIPFILE" --title "$VERSION"
            echo "Release $VERSION erstellt!"

            # Prüfen, ob dies die höchste Version ist
            version_number=$(echo "$VERSION" | sed 's/v//; s/\.//g')
            if [ "$version_number" -gt "$latest_number" ]; then
              latest_number=$version_number
              latest_version=$VERSION
            fi
          done

          # Höchste Version als latest markieren
          if [ -n "$latest_version" ]; then
            echo "Setze $latest_version als latest Release"
            gh release edit "$latest_version" --latest
          fi
