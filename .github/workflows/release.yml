name: Sync & Release All New Folders

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # alle Tags verfügbar

      - name: Git konfigurieren
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fork synchronisieren
        run: |
          git remote add upstream https://github.com/BlackRabbitMsk/ProjectZ.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories
          git push origin main

      - name: Alle Hauptordner prüfen und Releases erstellen
        run: |
          for d in */ ; do
            folder=$(basename "$d")
            echo "Hauptordner gefunden: $folder"
            
            # Version aus Ordnernamen extrahieren
            version=$(echo "$folder" | awk -F'_' '{print $NF}')
            tag="v$version"

            # Prüfen, ob Release schon existiert
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "Neues Release wird erstellt: $folder -> $tag"
              zipfile="${folder}.zip"
              zip -r "$zipfile" "$folder"
              gh release create "$tag" "$zipfile" --title "Release $tag"
            else
              echo "Release $tag existiert bereits, überspringe $folder"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
