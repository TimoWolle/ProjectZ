name: Auto Force Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: GitHub CLI installieren
        run: |
          sudo apt update
          sudo apt install -y gh zip

      - name: Force Releases erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for d in */ ; do
            folder=$(basename "$d")
            VERSION=$(echo "$folder" | awk -F'_' '{print $NF}')
            VERSION="v$VERSION"

            ZIPFILE="${folder}.zip"
            echo "Hauptordner gefunden: $folder"
            echo "Force Release wird erstellt: $folder -> $VERSION"

            # ZIP erstellen
            zip -r "$ZIPFILE" "$folder"
            echo "ZIP-Datei erstellt: $ZIPFILE"

            # Release löschen, falls schon vorhanden
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "Release $VERSION existiert bereits, lösche es..."
              gh release delete "$VERSION" --yes
            fi

            # Neues Release erstellen
            gh release create "$VERSION" "$ZIPFILE" --title "$VERSION"
            echo "Release $VERSION erstellt!"
          done
