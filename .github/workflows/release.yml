name: Sync & Release New Folders

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Git konfigurieren
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fork synchronisieren
        run: |
          git remote add upstream https://github.com/BlackRabbitMsk/ProjectZ.git || true
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories
          git push origin main

      - name: Hauptordner finden und releasen
        run: |
          for d in */ ; do
            folder=$(basename "$d")
            echo "Hauptordner gefunden: $folder"

            # Version extrahieren
            VERSION="v$(echo "$folder" | awk -F'_' '{print $NF}')"
            echo "Neues Release wird erstellt: $folder -> $VERSION"

            # Prüfen, ob Release schon existiert
            if gh release view "$VERSION" &>/dev/null; then
              echo "Release $VERSION existiert bereits, überspringe."
              continue
            fi

            # Zip erstellen
            ZIPFILE="${folder}.zip"
            zip -r "$ZIPFILE" "$folder"
            echo "ZIP-Datei erstellt: $ZIPFILE"

            # Tag erstellen/pushen
            git tag -f "$VERSION"
            git push origin "$VERSION"

            # GitHub Release erstellen
            gh release create "$VERSION" "$ZIPFILE" --title "Release $VERSION"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
