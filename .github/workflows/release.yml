name: Sync & Release New Folder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Git konfigurieren
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fork synchronisieren
        run: |
          git remote add upstream https://github.com/BlackRabbitMsk/ProjectZ.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories
          git push origin main

      - name: Neuen Hauptordner finden
        id: find_new_folder
        run: |
          NEW_FOLDER=$(find . -maxdepth 1 -type d ! -name '.' | head -n 1)
          NEW_FOLDER=$(basename "$NEW_FOLDER")
          echo "Neuer Hauptordner: $NEW_FOLDER"
          echo "folder=$NEW_FOLDER" >> $GITHUB_ENV

      - name: Ordner zippen
        run: |
          if [ -n "$NEW_FOLDER" ]; then
            VERSION=$(date +%Y%m%d%H%M%S)
            ZIPFILE="${NEW_FOLDER}-${VERSION}.zip"
            zip -r $ZIPFILE $NEW_FOLDER
            echo "ZIP-Datei erstellt: $ZIPFILE"
          else
            echo "Kein neuer Hauptordner gefunden. Abbruch."
            exit 1
          fi

      - name: Release erstellen und ZIP hochladen
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
