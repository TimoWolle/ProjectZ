name: Sync & Release New Folders

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Git konfigurieren
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fork synchronisieren
        run: |
          git remote add upstream https://github.com/BlackRabbitMsk/ProjectZ.git || true
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories || true
          git push origin main || true

      - name: Hauptordner finden und Releases erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for d in */ ; do
            folder=$(basename "$d")
            echo "Hauptordner gefunden: $folder"

            VERSION=$(echo "$folder" | awk -F'_' '{print $NF}')
            VERSION="v$VERSION"
            echo "Neues Release wird erstellt: $folder -> $VERSION"

            if git ls-remote --tags origin | grep -q "$VERSION"; then
              echo "Tag $VERSION existiert bereits. Überspringe."
              continue
            fi

            ZIPFILE="${folder}.zip"
            zip -r "$ZIPFILE" "$folder"
            echo "ZIP-Datei erstellt: $ZIPFILE"

            # GitHub Release erstellen
            gh release create "$VERSION" "$ZIPFILE" --title "$VERSION"
          done
