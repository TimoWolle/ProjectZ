name: Sync & Release New Folder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Git konfigurieren
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fork synchronisieren
        run: |
          git remote add upstream https://github.com/BlackRabbitMsk/ProjectZ.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories
          git push origin main

      - name: Neuen Hauptordner finden
        id: find_folder
        run: |
          NEW_FOLDER=$(find . -maxdepth 1 -type d ! -name '.' | head -n 1)
          NEW_FOLDER=$(basename "$NEW_FOLDER")
          echo "Neuer Hauptordner: $NEW_FOLDER"
          echo "folder=$NEW_FOLDER" >> $GITHUB_ENV

      - name: Version aus Ordnernamen extrahieren
        id: extract_version
        run: |
          # Beispiel: ProjectZ_free_2.0 -> 2.0
          VERSION=$(echo "$folder" | awk -F'_' '{print $NF}')
          VERSION="v$VERSION"
          echo "Erkannte Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        env:
          folder: ${{ env.folder }}

      - name: Ordner zippen
        id: zip_folder
        run: |
          if [ -n "$folder" ]; then
            ZIPFILE="${folder}.zip"
            zip -r "$ZIPFILE" "$folder"
            echo "ZIP-Datei erstellt: $ZIPFILE"
            echo "ZIPFILE=$ZIPFILE" >> $GITHUB_ENV
          else
            echo "Kein neuer Hauptordner gefunden. Abbruch."
            exit 1
          fi
        env:
          folder: ${{ env.folder }}
          VERSION: ${{ env.VERSION }}

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          files: ${{ env.ZIPFILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
